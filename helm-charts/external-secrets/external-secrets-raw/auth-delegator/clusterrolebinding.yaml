# Clusters whose Vault auth mount has disable_local_ca_jwt (the VPS, mount kubernetes-vps): Vault reviews the
# ServiceAccount token with that same token, so the ServiceAccount must be allowed to create TokenReviews.
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRoleBinding
  metadata:
      name: external-secrets-vault-auth-delegator
  roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:auth-delegator
  subjects:
      - kind: ServiceAccount
        name: external-secrets
        namespace: external-secrets
