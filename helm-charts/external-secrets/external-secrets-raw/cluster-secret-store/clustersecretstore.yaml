# Apps declare ExternalSecrets with remoteRef.key "<prefix>/<name>" (e.g. homelab/cloudflare). Same store name and
# paths in every cluster; the Vault address and the auth mount come from the environment (k8s01: in-cluster Vault,
# mount kubernetes; VPS: vault.<domain> over the tailnet, mount kubernetes-vps).
- apiVersion: external-secrets.io/v1
  kind: ClusterSecretStore
  metadata:
      name: vault
  spec:
      provider:
          vault:
              server: {{ .Values.vault.address }}
              path: {{ .Values.vault.kvMount }}
              version: v2
              auth:
                  kubernetes:
                      mountPath: {{ .Values.vault.authMount }}
                      role: external-secrets
                      serviceAccountRef:
                          name: external-secrets
                          namespace: external-secrets
      # Only platform namespaces (platform.namespaces of the environment) may use it. Workload apps
      # (homelab-gitops-apps) read their own secret/homelab/apps/<namespace>/* through a SecretStore of their
      # namespace and the Vault role "apps" (docs/runbooks/vault.md).
      conditions:
          - namespaces:
                {{- toYaml .Values.platform.namespaces | nindent 18 }}
