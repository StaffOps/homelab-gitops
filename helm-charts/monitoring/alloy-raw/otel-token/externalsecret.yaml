# Bearer token of the otel-gateway external receiver on k8s01 (Vault homelab/otel external-token)
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: otel-external-token
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: otel-external-token
      data:
          - secretKey: token
            remoteRef:
                key: {{ .Values.vault.prefix }}/otel
                property: external-token
