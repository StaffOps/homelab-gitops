# OTLP receiver of Alloy on a fixed ClusterIP: the host (Hermes monitoring.export.otlp.endpoint
# http://10.43.100.40:4318/v1/metrics) cannot use cluster DNS
- apiVersion: v1
  kind: Service
  metadata:
      name: alloy-otlp
  spec:
      type: ClusterIP
      clusterIP: 10.43.100.40
      selector:
          app.kubernetes.io/name: alloy
          app.kubernetes.io/instance: alloy
      ports:
          - name: otlp-http
            port: 4318
            targetPort: 4318
          - name: otlp-grpc
            port: 4317
            targetPort: 4317
