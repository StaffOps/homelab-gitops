# Inserted as-is (readFile, no tpl): write Prometheus templates plainly.
# CoreDNS alerts from the coredns-mixin (https://github.com/povilasv/coredns-mixin, alerts/*.libsonnet); kube-prometheus-stack
# ships none. Selector job="coredns". CoreDNS >= 1.11 replaced coredns_forward_{request_duration_seconds,responses_total,
# healthcheck_failures_total} with coredns_proxy_*{proxy_name="forward"} (https://coredns.io/plugins/forward/#metrics):
# the forward rules use the documented replacements, same thresholds.
groups:
    - name: coredns
      rules:
          - alert: CoreDNSDown
            expr: absent(up{job="coredns"} == 1)
            for: 15m
            labels:
                severity: critical
            annotations:
                summary: CoreDNS has disappeared from Prometheus target discovery.
                description: Cluster DNS is down or not scraped. Pods cannot resolve Services or external names. Check the coredns pods in kube-system.
          - alert: CoreDNSLatencyHigh
            expr: histogram_quantile(0.99, sum without (instance, pod) (rate(coredns_dns_request_duration_seconds_bucket{job="coredns"}[5m]))) > 4
            for: 10m
            labels:
                severity: critical
            annotations:
                summary: CoreDNS is experiencing high 99th percentile latency.
                description: CoreDNS has 99th percentile latency of {{ $value }} seconds for server {{ $labels.server }} zone {{ $labels.zone }}.
          - alert: CoreDNSErrorsHigh
            expr: |-
                sum without (pod, instance, server, zone, view, rcode, plugin) (rate(coredns_dns_responses_total{job="coredns", rcode="SERVFAIL"}[5m]))
                  /
                sum without (pod, instance, server, zone, view, rcode, plugin) (rate(coredns_dns_responses_total{job="coredns"}[5m])) > 0.03
            for: 10m
            labels:
                severity: critical
            annotations:
                summary: CoreDNS is returning SERVFAIL.
                description: CoreDNS is returning SERVFAIL for {{ $value | humanizePercentage }} of requests.
          - alert: CoreDNSErrorsHigh
            expr: |-
                sum without (pod, instance, server, zone, view, rcode, plugin) (rate(coredns_dns_responses_total{job="coredns", rcode="SERVFAIL"}[5m]))
                  /
                sum without (pod, instance, server, zone, view, rcode, plugin) (rate(coredns_dns_responses_total{job="coredns"}[5m])) > 0.01
            for: 10m
            labels:
                severity: warning
            annotations:
                summary: CoreDNS is returning SERVFAIL.
                description: CoreDNS is returning SERVFAIL for {{ $value | humanizePercentage }} of requests.
    - name: coredns_forward
      rules:
          - alert: CoreDNSForwardLatencyHigh
            expr: histogram_quantile(0.99, sum without (pod, instance, rcode) (rate(coredns_proxy_request_duration_seconds_bucket{job="coredns", proxy_name="forward"}[5m]))) > 4
            for: 10m
            labels:
                severity: critical
            annotations:
                summary: CoreDNS is experiencing high latency forwarding requests.
                description: CoreDNS has 99th percentile latency of {{ $value }} seconds forwarding requests to {{ $labels.to }}.
          - alert: CoreDNSForwardErrorsHigh
            expr: |-
                sum without (pod, instance, rcode) (rate(coredns_proxy_request_duration_seconds_count{job="coredns", proxy_name="forward", rcode="SERVFAIL"}[5m]))
                  /
                sum without (pod, instance, rcode) (rate(coredns_proxy_request_duration_seconds_count{job="coredns", proxy_name="forward"}[5m])) > 0.03
            for: 10m
            labels:
                severity: critical
            annotations:
                summary: CoreDNS is returning SERVFAIL for forward requests.
                description: CoreDNS is returning SERVFAIL for {{ $value | humanizePercentage }} of forward requests to {{ $labels.to }}.
          - alert: CoreDNSForwardErrorsHigh
            expr: |-
                sum without (pod, instance, rcode) (rate(coredns_proxy_request_duration_seconds_count{job="coredns", proxy_name="forward", rcode="SERVFAIL"}[5m]))
                  /
                sum without (pod, instance, rcode) (rate(coredns_proxy_request_duration_seconds_count{job="coredns", proxy_name="forward"}[5m])) > 0.01
            for: 10m
            labels:
                severity: warning
            annotations:
                summary: CoreDNS is returning SERVFAIL for forward requests.
                description: CoreDNS is returning SERVFAIL for {{ $value | humanizePercentage }} of forward requests to {{ $labels.to }}.
          - alert: CoreDNSForwardHealthcheckFailureCount
            expr: sum without (pod, instance) (rate(coredns_proxy_healthcheck_failures_total{job="coredns", proxy_name="forward"}[5m])) > 0
            for: 10m
            labels:
                severity: warning
            annotations:
                summary: CoreDNS health checks have failed to upstream server.
                description: CoreDNS health checks have failed to upstream server {{ $labels.to }}.
          - alert: CoreDNSForwardHealthcheckBrokenCount
            expr: sum without (pod, instance) (rate(coredns_forward_healthcheck_broken_total{job="coredns"}[5m])) > 0
            for: 10m
            labels:
                severity: warning
            annotations:
                summary: CoreDNS health checks have failed for all upstream servers.
                description: CoreDNS health checks have failed for all upstream servers.
