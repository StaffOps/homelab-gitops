# Pull Secret for the private image ghcr.io/staffops/backstage-platform: the read:packages PAT already used by the
# helmfile plugin and the image-scan workflow (Vault homelab/argocd-ghcr-charts: username, token).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: backstage-ghcr
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: backstage-ghcr
          template:
              type: kubernetes.io/dockerconfigjson
              engineVersion: v2
              data:
                  .dockerconfigjson: '{{`{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}`}}'
      data:
          - secretKey: username
            remoteRef:
                key: {{ .Values.vault.prefix }}/argocd-ghcr-charts
                property: username
          - secretKey: token
            remoteRef:
                key: {{ .Values.vault.prefix }}/argocd-ghcr-charts
                property: token
