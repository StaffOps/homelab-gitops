# Grafana dashboard (picked up by the Grafana sidecar from namespace monitoring)
- apiVersion: v1
  kind: ConfigMap
  metadata:
      name: llm-dashboard
      namespace: monitoring
      labels:
          grafana_dashboard: "1"
  data:
      llm.json: |
          {
            "title": "LLM (llama.cpp)",
            "uid": "llm-llamacpp",
            "schemaVersion": 39,
            "time": {
              "from": "now-3h",
              "to": "now"
            },
            "refresh": "30s",
            "tags": [
              "llm"
            ],
            "panels": [
              {
                "type": "stat",
                "title": "Generation (tok/s, avg)",
                "gridPos": {
                  "x": 0,
                  "y": 0,
                  "w": 6,
                  "h": 4
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "none",
                    "decimals": 1
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "max(llamacpp:predicted_tokens_seconds{namespace=\"llm\"})"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Prompt processing (tok/s, avg)",
                "gridPos": {
                  "x": 6,
                  "y": 0,
                  "w": 6,
                  "h": 4
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "none",
                    "decimals": 1
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "max(llamacpp:prompt_tokens_seconds{namespace=\"llm\"})"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Requests in flight",
                "gridPos": {
                  "x": 12,
                  "y": 0,
                  "w": 6,
                  "h": 4
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "none",
                    "decimals": 1
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum(llamacpp:requests_processing{namespace=\"llm\"})"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Requests queued",
                "gridPos": {
                  "x": 18,
                  "y": 0,
                  "w": 6,
                  "h": 4
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "none",
                    "decimals": 1
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum(llamacpp:requests_deferred{namespace=\"llm\"})"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Tokens generated per second",
                "gridPos": {
                  "x": 0,
                  "y": 4,
                  "w": 12,
                  "h": 8
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "none"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum(rate(llamacpp:tokens_predicted_total{namespace=\"llm\"}[1m]))",
                    "legendFormat": "generated"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Prompt tokens processed per second",
                "gridPos": {
                  "x": 12,
                  "y": 4,
                  "w": 12,
                  "h": 8
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "none"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum(rate(llamacpp:prompt_tokens_total{namespace=\"llm\"}[1m]))",
                    "legendFormat": "prompt"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Average speed reported by the server",
                "gridPos": {
                  "x": 0,
                  "y": 12,
                  "w": 12,
                  "h": 8
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "none"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "max(llamacpp:predicted_tokens_seconds{namespace=\"llm\"})",
                    "legendFormat": "generation tok/s"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Decode calls per second",
                "gridPos": {
                  "x": 12,
                  "y": 12,
                  "w": 12,
                  "h": 8
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "none"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum(rate(llamacpp:n_decode_total{namespace=\"llm\"}[1m]))",
                    "legendFormat": "llama_decode"
                  }
                ]
              }
            ]
          }
