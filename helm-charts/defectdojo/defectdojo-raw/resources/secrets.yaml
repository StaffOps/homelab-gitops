# Vault homelab/defectdojo: admin-password (initial password of the local "admin"; the initializer only sets it
# when it creates the user), secret-key (Django SECRET_KEY: sessions, signed tokens), credential-aes-key (encrypts
# the secrets DefectDojo stores in its database, e.g. tool configurations; keep it).
# Secret "defectdojo" is the one the chart would otherwise generate with random values on every render. The
# metrics basic-auth password (nginx protects /django_metrics with it) is derived from secret-key, so it is stable
# without a Vault key of its own and without regenerating on each refresh.
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: defectdojo
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: defectdojo
          template:
              engineVersion: v2
              data:
                  DD_ADMIN_PASSWORD: '{{`{{ .adminPassword }}`}}'
                  DD_SECRET_KEY: '{{`{{ .secretKey }}`}}'
                  DD_CREDENTIAL_AES_256_KEY: '{{`{{ .credentialAesKey }}`}}'
                  METRICS_HTTP_AUTH_USER: monitoring
                  METRICS_HTTP_AUTH_PASSWORD: '{{`{{ printf "metrics/%s" .secretKey | sha256sum }}`}}'
      data:
          - secretKey: adminPassword
            remoteRef:
                key: {{ .Values.vault.prefix }}/defectdojo
                property: admin-password
          - secretKey: secretKey
            remoteRef:
                key: {{ .Values.vault.prefix }}/defectdojo
                property: secret-key
          - secretKey: credentialAesKey
            remoteRef:
                key: {{ .Values.vault.prefix }}/defectdojo
                property: credential-aes-key
# Valkey (Celery broker) password: random, generated once by External Secrets (refreshPolicy CreatedOnce) and
# never rotated. Read by the Valkey StatefulSet and by every DefectDojo container. Losing it is harmless: delete
# the Secret and restart Valkey and DefectDojo to get a new one.
- apiVersion: generators.external-secrets.io/v1alpha1
  kind: Password
  metadata:
      name: defectdojo-32
  spec:
      length: 32
      symbols: 0
      allowRepeat: true
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: defectdojo-valkey-specific
  spec:
      refreshPolicy: CreatedOnce
      target:
          name: defectdojo-valkey-specific
      dataFrom:
          - sourceRef:
                generatorRef:
                    apiVersion: generators.external-secrets.io/v1alpha1
                    kind: Password
                    name: defectdojo-32
            rewrite:
                - regexp:
                      source: ^password$
                      target: valkey-password
