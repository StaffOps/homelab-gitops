# Istio ambient (namespace label from Kyverno): traffic between mesh Pods arrives on ztunnel's HBONE port 15008 and
# kubelet probes arrive from 169.254.7.127. The argo-cd chart's NetworkPolicies only allow the application ports,
# so this extra policy (policies add up) allows those two for every Pod in the namespace.
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
      name: allow-istio-ambient
  spec:
      podSelector: {}
      policyTypes:
          - Ingress
      ingress:
          - ports:
                - protocol: TCP
                  port: 15008
          - from:
                - ipBlock:
                      cidr: 169.254.7.127/32
