# Client secret of the Keycloak client argocd (Vault homelab/oidc: argocd), referenced by argocd-cm
# oidc.config as $argocd-oidc:clientSecret. Argo CD only reads Secrets labelled part-of=argocd.
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: argocd-oidc
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: argocd-oidc
          template:
              metadata:
                  labels:
                      app.kubernetes.io/part-of: argocd
      data:
          - secretKey: clientSecret
            remoteRef:
                key: {{ .Values.vault.prefix }}/oidc
                property: argocd
