# Project of the workload apps (ApplicationSet apps, repo homelab-gitops-apps). Guard rails so an app cannot
# change the platform: only the apps repo as source; any namespace except the platform's and the system ones;
# no cluster-scoped objects except the app's own Namespace (CreateNamespace needs it), so no CRDs, RBAC
# ClusterRoles, webhooks, ClusterSecretStores or StorageClasses. Platform pieces an app needs go in homelab-gitops.
# Keep the deny list in sync with the namespaces of applicationset-platform.yaml.
- apiVersion: argoproj.io/v1alpha1
  kind: AppProject
  metadata:
      name: apps
  spec:
      description: Workload apps of the homelab (StaffOps/homelab-gitops-apps)
      sourceRepos:
          - {{ .Values.apps.repoURL }}
      destinations:
          - server: https://kubernetes.default.svc
            namespace: '*'
          {{- range list "default" "kube-system" "kube-public" "kube-node-lease" "argo" "calico-system" "calico-apiserver" "tigera-operator" "local-path-storage" "metallb-system" "vault" "external-secrets" "cert-manager" "external-dns" "istio-system" "gateway" "monitoring" "opentelemetry" "cnpg-system" "keycloak" "keda" "dependency-track" "velero" "kyverno" "nvidia-device-plugin" "mcp-servers" "llm" "harbor" "argo-rollouts" "argo-events" "argo-workflows" }}
          - server: https://kubernetes.default.svc
            namespace: '!{{ . }}'
          {{- end }}
      clusterResourceWhitelist:
          - group: ''
            kind: Namespace
      namespaceResourceBlacklist:
          # quotas and limits of an app namespace are the platform's call
          - group: ''
            kind: ResourceQuota
          - group: ''
            kind: LimitRange
      namespaceResourceWhitelist:
          - group: '*'
            kind: '*'
