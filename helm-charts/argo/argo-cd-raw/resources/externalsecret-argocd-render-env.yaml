# Render-time values for the helmfile plugin (env of the CMP sidecar). Keep this list short: only values
# that must appear in a manifest yet stay out of the public repository.
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: argocd-render-env
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: argocd-render-env
      data:
          - secretKey: R2_ENDPOINT # velero BackupStorageLocation s3Url
            remoteRef:
                key: {{ .Values.vault.prefix }}/velero
                property: endpoint
          # Pull of the private charts oci://ghcr.io/staffops/charts (StaffOps/private-helm-charts): a helmfile
          # declares the repository with username/password '{{`{{ env "GHCR_CHARTS_USERNAME" }}`}}' /
          # '{{`{{ env "GHCR_CHARTS_TOKEN" }}`}}' and logs in by itself (Argo CD does not pass repo creds to plugins)
          - secretKey: GHCR_CHARTS_USERNAME
            remoteRef:
                key: {{ .Values.vault.prefix }}/argocd-ghcr-charts
                property: username
          - secretKey: GHCR_CHARTS_TOKEN # classic PAT, read:packages only
            remoteRef:
                key: {{ .Values.vault.prefix }}/argocd-ghcr-charts
                property: token
