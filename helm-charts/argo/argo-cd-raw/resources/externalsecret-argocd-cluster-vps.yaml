# Cluster Secret of the VPS k3s (ADR 0008): Argo CD finds it by the label secret-type=cluster. The bearer token
# of the ServiceAccount argocd-manager on the k3s and its CA come from Vault homelab/argocd-cluster-vps
# (keys token, ca-data = base64 of the k3s server CA). ESO's template engine uses the same delimiters as tpl,
# so its expressions are escaped once.
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: argocd-cluster-vps
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: argocd-cluster-vps
          template:
              metadata:
                  labels:
                      argocd.argoproj.io/secret-type: cluster
                      app.kubernetes.io/part-of: argocd
              data:
                  name: vps
                  server: {{ .Values.remoteClusters.vps.server }}
                  config: |
                      {"bearerToken": "{{`{{ .token }}`}}", "tlsClientConfig": {"insecure": false, "caData": "{{`{{ .caData }}`}}"}}
      data:
          - secretKey: token
            remoteRef:
                key: {{ .Values.vault.prefix }}/argocd-cluster-vps
                property: token
          - secretKey: caData
            remoteRef:
                key: {{ .Values.vault.prefix }}/argocd-cluster-vps
                property: ca-data
