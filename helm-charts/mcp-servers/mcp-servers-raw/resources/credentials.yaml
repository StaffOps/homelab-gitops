# Backend credentials of the MCP servers (Vault homelab/mcp: grafana-token, argocd-token)
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: mcp-credentials
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: mcp-credentials
      dataFrom:
          - extract:
                key: {{ .Values.vault.prefix }}/mcp
      data:
          # secret of the Keycloak client keycloak-mcp (same value the realm import uses)
          - secretKey: keycloak-mcp-client-secret
            remoteRef:
                key: {{ .Values.vault.prefix }}/oidc
                property: keycloak-mcp
