# kubernetes-mcp-server, read-only, as its own ServiceAccount bound to ClusterRole mcp-read (rbac.yaml: every
# kind except Secrets, including CRDs installed later); Secrets are also denied in the server config. cluster_auth_mode=kubeconfig: the caller's Keycloak JWT is never sent to
# the API server.
- apiVersion: v1
  kind: ServiceAccount
  metadata:
      name: kubernetes-mcp
- apiVersion: v1
  kind: ConfigMap
  metadata:
      name: kubernetes-mcp
  data:
      config.toml: |
          port = "8080"
          stateless = true
          read_only = true
          disable_destructive = true
          cluster_auth_mode = "kubeconfig"
          toolsets = ["core", "config", "helm"]
          [[denied_resources]]
          group = ""
          version = "v1"
          kind = "Secret"
- apiVersion: apps/v1
  kind: Deployment
  metadata:
      name: kubernetes-mcp
  spec:
      replicas: 1
      selector:
          matchLabels:
              app: kubernetes-mcp
      template:
          metadata:
              labels:
                  app: kubernetes-mcp
          spec:
              serviceAccountName: kubernetes-mcp
              securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                      type: RuntimeDefault
              containers:
                  - name: mcp
                    image: {{ index .Values "mcp-servers-raw" "kubernetesMcpImage" }}
                    args: [--config, /etc/mcp/config.toml]
                    ports:
                        - name: http
                          containerPort: 8080
                    securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                            drop: [ALL]
                    volumeMounts:
                        - name: config
                          mountPath: /etc/mcp
                    resources:
                        requests:
                            cpu: 10m
                            memory: 64Mi
                        limits:
                            memory: 256Mi
              volumes:
                  - name: config
                    configMap:
                        name: kubernetes-mcp
- apiVersion: v1
  kind: Service
  metadata:
      name: kubernetes-mcp
  spec:
      selector:
          app: kubernetes-mcp
      ports:
          - name: http
            port: 8080
            targetPort: http
            appProtocol: http
