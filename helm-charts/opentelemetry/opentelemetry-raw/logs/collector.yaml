# otel-logs: one per node. Container logs from /var/log/pods of its node, plus the cluster's Kubernetes
# events (one pod at a time holds the lease, so every event is sent once even with many nodes). Both go
# straight to Loki over OTLP/HTTP; no gateway in this path.
- apiVersion: opentelemetry.io/v1beta1
  kind: OpenTelemetryCollector
  metadata:
      name: otel-logs
  spec:
      mode: daemonset
      image: {{ index .Values "opentelemetry-raw" "collectorImage" }}
      serviceAccount: otel-logs
      env:
          - name: GOMEMLIMIT
            value: 200MiB
          - name: K8S_NODE_NAME
            valueFrom:
                fieldRef:
                    fieldPath: spec.nodeName
          - name: K8S_POD_NAME
            valueFrom:
                fieldRef:
                    fieldPath: metadata.name
      # /var/log/pods is root-only on the node
      securityContext:
          runAsUser: 0
          runAsGroup: 0
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
              drop: [ALL]
              add: [DAC_READ_SEARCH]
      resources:
          requests:
              cpu: 150m
              memory: 128Mi
          limits:
              memory: 256Mi
      observability:
          metrics:
              enableMetrics: true
      volumes:
          - name: varlogpods
            hostPath:
                path: /var/log/pods
          - name: checkpoints
            hostPath:
                path: /var/lib/otelcol/logs # survives restarts: no re-read, no gap
                type: DirectoryOrCreate
      volumeMounts:
          - name: varlogpods
            mountPath: /var/log/pods
            readOnly: true
          - name: checkpoints
            mountPath: /var/lib/otelcol/file_storage
      config:
          extensions:
              file_storage/checkpoints:
                  directory: /var/lib/otelcol/file_storage
                  create_directory: true
                  timeout: 10s
              k8s_leader_elector:
                  auth_type: serviceAccount
                  lease_name: otel-logs-events
                  lease_namespace: opentelemetry
          receivers:
              file_log:
                  include:
                      - /var/log/pods/*/*/*.log
                  exclude:
                      # this collector's own logs (avoid amplification on errors)
                      - /var/log/pods/opentelemetry_otel-logs-collector-*/*/*.log
                  start_at: end
                  include_file_path: true
                  storage: file_storage/checkpoints
                  retry_on_failure:
                      enabled: true
                  operators:
                      - type: container
                        id: container-parser
                        add_metadata_from_filepath: true
                      - type: recombine
                        id: recombine-stacktrace
                        combine_field: body
                        source_identifier: attributes["log.file.path"]
                        is_first_entry: 'body not matches "^(\\s+at\\s|\\s+\\.\\.\\.\\s|Caused by:|goroutine\\s|\\s+File \"|Traceback)"'
                        max_log_size: 102400
                        combine_with: "\n"
              k8s_objects:
                  auth_type: serviceAccount
                  k8s_leader_elector: k8s_leader_elector
                  objects:
                      - name: events
                        group: events.k8s.io
                        mode: watch
          processors:
              memory_limiter:
                  check_interval: 5s
                  limit_percentage: 80
                  spike_limit_percentage: 15
              k8s_attributes:
                  auth_type: serviceAccount
                  filter:
                      node_from_env_var: K8S_NODE_NAME
                  extract:
                      metadata:
                          - k8s.namespace.name
                          - k8s.pod.name
                          - k8s.node.name
                          - k8s.container.name
                          - k8s.deployment.name
                          - k8s.statefulset.name
                          - k8s.daemonset.name
                          - service.name
                          - service.namespace
                          - service.version
                  pod_association:
                      - sources:
                            - from: resource_attribute
                              name: k8s.pod.uid
              resource:
                  attributes:
                      # cluster: the one label every signal carries in every cluster (metrics, logs, traces);
                      # k8s.cluster.name stays for the OTel semantic conventions
                      - key: cluster
                        value: {{ .Values.cluster.name }}
                        action: upsert
                      - key: k8s.cluster.name
                        value: {{ .Values.cluster.name }}
                        action: upsert
              # Events: one stream in Loki (service_name="k8s-events"), namespace of the involved object
              transform/events:
                  error_mode: ignore
                  log_statements:
                      - context: log
                        statements:
                            - set(resource.attributes["service.name"], "k8s-events")
                            - set(resource.attributes["k8s.namespace.name"], body["object"]["regarding"]["namespace"]) where body["object"]["regarding"]["namespace"] != nil
                            - set(attributes["k8s.event.reason"], body["object"]["reason"])
                            - set(attributes["k8s.event.type"], body["object"]["type"])
                            - set(attributes["k8s.object.kind"], body["object"]["regarding"]["kind"])
                            - set(attributes["k8s.object.name"], body["object"]["regarding"]["name"])
                            - set(severity_text, body["object"]["type"])
              batch:
                  send_batch_size: 1000
                  send_batch_max_size: 2000
                  timeout: 5s
          exporters:
              otlp_http/loki:
                  endpoint: http://loki.monitoring:3100/otlp
                  sending_queue:
                      enabled: true
                      queue_size: 5000
                      storage: file_storage/checkpoints # queue survives restarts too
                  retry_on_failure:
                      enabled: true
                      max_elapsed_time: 600s
          service:
              extensions: [file_storage/checkpoints, k8s_leader_elector]
              telemetry:
                  metrics:
                      level: normal
                      readers:
                          - pull:
                                exporter:
                                    prometheus:
                                        host: 0.0.0.0
                                        port: 8888
              pipelines:
                  logs/pods:
                      receivers: [file_log]
                      processors: [memory_limiter, k8s_attributes, resource, batch]
                      exporters: [otlp_http/loki]
                  logs/events:
                      receivers: [k8s_objects]
                      processors: [memory_limiter, transform/events, resource, batch]
                      exporters: [otlp_http/loki]
- apiVersion: v1
  kind: ServiceAccount
  metadata:
      name: otel-logs
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRole
  metadata:
      name: otel-logs
  rules:
      - apiGroups: [""]
        resources: [pods, namespaces, nodes]
        verbs: [get, list, watch]
      - apiGroups: [apps]
        resources: [replicasets, deployments, statefulsets, daemonsets]
        verbs: [get, list, watch]
      - apiGroups: [events.k8s.io]
        resources: [events]
        verbs: [get, list, watch]
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRoleBinding
  metadata:
      name: otel-logs
  subjects:
      - kind: ServiceAccount
        name: otel-logs
        namespace: opentelemetry
  roleRef:
      kind: ClusterRole
      name: otel-logs
      apiGroup: rbac.authorization.k8s.io
# Lease for the events leader election
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
      name: otel-logs-leader
  rules:
      - apiGroups: [coordination.k8s.io]
        resources: [leases]
        verbs: [get, list, watch, create, update, patch]
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
      name: otel-logs-leader
  subjects:
      - kind: ServiceAccount
        name: otel-logs
        namespace: opentelemetry
  roleRef:
      kind: Role
      name: otel-logs-leader
      apiGroup: rbac.authorization.k8s.io
