# otel-gateway: the processing tier (gateway + process + span metrics in one). Receives OTLP from the agents
# (in-cluster, no auth) and from outside clusters such as the VPS (port 4319, bearer token, via
# https://otel.<domain>). Generates span metrics and the service graph, then exports traces to Tempo,
# metrics to Prometheus (OTLP receiver) and logs to Loki.
- apiVersion: opentelemetry.io/v1beta1
  kind: OpenTelemetryCollector
  metadata:
      name: otel-gateway
  spec:
      mode: deployment
      replicas: 1
      image: {{ index .Values "opentelemetry-raw" "collectorImage" }}
      serviceAccount: otel-gateway
      env:
          - name: GOMEMLIMIT
            value: 800MiB
          - name: OTEL_EXTERNAL_TOKEN
            valueFrom:
                secretKeyRef:
                    name: otel-gateway-auth
                    key: token
      resources:
          requests:
              cpu: 20m
              memory: 192Mi
          limits:
              memory: 1Gi
      observability:
          metrics:
              enableMetrics: true
      config:
          extensions:
              health_check:
                  endpoint: 0.0.0.0:13133
              bearertokenauth/external:
                  scheme: Bearer
                  token: ${env:OTEL_EXTERNAL_TOKEN}
          receivers:
              otlp:
                  protocols:
                      grpc:
                          endpoint: 0.0.0.0:4317
                      http:
                          endpoint: 0.0.0.0:4318
              otlp/external:
                  protocols:
                      http:
                          endpoint: 0.0.0.0:4319
                          auth:
                              authenticator: bearertokenauth/external
          processors:
              memory_limiter:
                  check_interval: 5s
                  limit_percentage: 80
                  spike_limit_percentage: 15
              # Data that arrives without a cluster (an app sending OTLP straight here) gets this cluster's name;
              # insert never overwrites, so what the agents or the VPS (Alloy, cluster=vps) set is kept
              resource/cluster:
                  attributes:
                      - key: cluster
                        value: {{ .Values.cluster.name }}
                        action: insert
                      - key: k8s.cluster.name
                        value: {{ .Values.cluster.name }}
                        action: insert
              batch:
                  send_batch_size: 2000
                  send_batch_max_size: 5000
                  timeout: 5s
              # Span metrics / service graph series: drop per-pod and per-instance resource attributes, so a pod or
              # gateway restart does not start new series. service.name + service.namespace (→ job) and
              # service.version stay; instance (from service.instance.id) becomes empty.
              transform/connector_output:
                  error_mode: ignore
                  metric_statements:
                      - context: resource
                        statements:
                            - delete_key(attributes, "k8s.pod.name")
                            - delete_key(attributes, "k8s.pod.uid")
                            - delete_key(attributes, "k8s.container.name")
                            - delete_key(attributes, "k8s.node.name")
                            - delete_key(attributes, "service.instance.id")
                            - delete_key(attributes, "collector.instance.id")
          connectors:
              # RED metrics of every span, computed here on 100 % of the spans of both clusters (no sampling
              # anywhere; with tail sampling this pipeline would have to stay before it). Prometheus names:
              # traces_span_metrics_calls_total, traces_span_metrics_duration_seconds_{bucket,sum,count};
              # error rate = status_code="STATUS_CODE_ERROR" / all (semconv: Unset = success). Exemplars → Tempo.
              span_metrics:
                  metrics_flush_interval: 30s
                  aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
                  histogram:
                      unit: s
                      explicit:
                          buckets: [2ms, 4ms, 8ms, 16ms, 32ms, 64ms, 128ms, 256ms, 512ms, 1024ms, 2048ms, 4096ms, 8192ms, 16s]
                  exemplars:
                      enabled: true
                  # Bounded attributes only (never ids, full URLs, query text or user values). gRPC status appears
                  # under both semconv names, depending on the SDK.
                  dimensions:
                      - name: http.request.method
                      - name: http.response.status_code
                      - name: http.route
                      - name: rpc.service
                      - name: rpc.method
                      - name: rpc.grpc.status_code
                      - name: rpc.response.status_code
                      - name: db.system.name
                      - name: db.operation.name
                      - name: db.response.status_code
                      - name: messaging.system
                      - name: messaging.operation.type
                      - name: messaging.destination.name
                      - name: error.type
                  resource_metrics_key_attributes:
                      - service.name
                      - service.namespace
                      - deployment.environment.name
                      - cluster
                      - k8s.cluster.name
                      - k8s.namespace.name
              # Service graph here, not in Tempo (Tempo's metrics-generator stays off: no duplicate series)
              service_graph:
                  latency_histogram_buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
                  dimensions:
                      - cluster
                      - k8s.cluster.name
                      - k8s.namespace.name
                  store:
                      ttl: 10s
                      max_items: 10000
          exporters:
              otlp_grpc/tempo:
                  endpoint: tempo.monitoring:4317
                  tls:
                      insecure: true
                  sending_queue:
                      enabled: true
                      queue_size: 5000
              otlp_http/prometheus:
                  endpoint: http://kps-prometheus.monitoring:9090/api/v1/otlp
                  sending_queue:
                      enabled: true
                      queue_size: 5000
              otlp_http/loki:
                  endpoint: http://loki.monitoring:3100/otlp
                  sending_queue:
                      enabled: true
                      queue_size: 5000
          service:
              extensions: [health_check, bearertokenauth/external]
              telemetry:
                  metrics:
                      level: normal
                      readers:
                          - pull:
                                exporter:
                                    prometheus:
                                        host: 0.0.0.0
                                        port: 8888
              pipelines:
                  traces:
                      receivers: [otlp, otlp/external]
                      processors: [memory_limiter, resource/cluster, batch]
                      exporters: [otlp_grpc/tempo, span_metrics, service_graph]
                  metrics:
                      receivers: [otlp, otlp/external]
                      processors: [memory_limiter, resource/cluster, batch]
                      exporters: [otlp_http/prometheus]
                  # resource/cluster inserts cluster=<this cluster> only where missing: service-graph series get it
                  # (the edge's client_cluster/server_cluster dimensions say which side is where); span metrics keep
                  # the cluster of the span's own resource
                  metrics/traces:
                      receivers: [span_metrics, service_graph]
                      processors: [memory_limiter, resource/cluster, transform/connector_output, batch]
                      exporters: [otlp_http/prometheus]
                  logs:
                      receivers: [otlp, otlp/external]
                      processors: [memory_limiter, resource/cluster, batch]
                      exporters: [otlp_http/loki]
- apiVersion: v1
  kind: ServiceAccount
  metadata:
      name: otel-gateway
# Bearer token of the external receiver (Vault homelab/otel: external-token); the VPS sends
# "Authorization: Bearer <token>".
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: otel-gateway-auth
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: otel-gateway-auth
      data:
          - secretKey: token
            remoteRef:
                key: {{ .Values.vault.prefix }}/otel
                property: external-token
# External entry: only the authenticated receiver (4319) is published, at https://otel.<domain>
- apiVersion: v1
  kind: Service
  metadata:
      name: otel-gateway-external
  spec:
      selector:
          app.kubernetes.io/component: opentelemetry-collector
          app.kubernetes.io/instance: opentelemetry.otel-gateway
      ports:
          - name: otlp-http-external
            port: 4319
            targetPort: 4319
            appProtocol: http
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
      name: otel-gateway-external
  spec:
      parentRefs:
          - name: {{ .Values.gateway.name }}
            namespace: {{ .Values.gateway.namespace }}
            sectionName: https
      hostnames:
          - otel.{{ .Values.domain }}
      rules:
          - matches:
                - path:
                      type: PathPrefix
                      value: /v1/
            backendRefs:
                - name: otel-gateway-external
                  port: 4319
