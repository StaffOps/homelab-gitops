# otel-agent: one per node. Receives OTLP from apps and OBI, light treatment (Kubernetes metadata, drop
# health-check noise), forwards everything to the gateway.
- apiVersion: opentelemetry.io/v1beta1
  kind: OpenTelemetryCollector
  metadata:
      name: otel-agent
  spec:
      mode: daemonset
      image: {{ index .Values "opentelemetry-raw" "collectorImage" }}
      serviceAccount: otel-agent
      trafficDistribution: PreferSameNode # apps reach the agent on their own node
      env:
          - name: GOMEMLIMIT
            value: 200MiB
          - name: K8S_NODE_NAME
            valueFrom:
                fieldRef:
                    fieldPath: spec.nodeName
      resources:
          requests:
              cpu: 50m
              memory: 128Mi
          limits:
              memory: 256Mi
      observability:
          metrics:
              enableMetrics: true
      config:
          receivers:
              otlp:
                  protocols:
                      grpc:
                          endpoint: 0.0.0.0:4317
                      http:
                          endpoint: 0.0.0.0:4318
          processors:
              memory_limiter:
                  check_interval: 5s
                  limit_percentage: 80
                  spike_limit_percentage: 15
              k8s_attributes:
                  auth_type: serviceAccount
                  filter:
                      node_from_env_var: K8S_NODE_NAME # only this node's pods
                  extract:
                      metadata:
                          - k8s.namespace.name
                          - k8s.pod.name
                          - k8s.pod.uid
                          - k8s.node.name
                          - k8s.container.name
                          - k8s.deployment.name
                          - k8s.statefulset.name
                          - k8s.daemonset.name
                          - service.name
                          - service.namespace
                          - service.version
                  pod_association:
                      - sources:
                            - from: resource_attribute
                              name: k8s.pod.uid
                      - sources:
                            - from: resource_attribute
                              name: k8s.pod.ip
                      - sources:
                            - from: connection
              resource:
                  attributes:
                      # cluster: the one label every signal carries in every cluster (metrics, logs, traces);
                      # k8s.cluster.name stays for the OTel semantic conventions
                      - key: cluster
                        value: {{ .Values.cluster.name }}
                        action: upsert
                      - key: k8s.cluster.name
                        value: {{ .Values.cluster.name }}
                        action: upsert
              filter/noise:
                  error_mode: ignore
                  traces:
                      span:
                          - IsMatch(attributes["url.path"], "^/(ping|health|healthz|ready|readyz|live|livez|metrics)$")
                          - IsMatch(attributes["http.route"], "^/(ping|health|healthz|ready|readyz|live|livez|metrics)$")
              batch:
                  send_batch_size: 1000
                  send_batch_max_size: 2000
                  timeout: 5s
          exporters:
              otlp_grpc:
                  endpoint: otel-gateway-collector.opentelemetry:4317
                  tls:
                      insecure: true
                  sending_queue:
                      enabled: true
                      queue_size: 2000
                  retry_on_failure:
                      enabled: true
          service:
              telemetry:
                  metrics:
                      level: normal
                      readers:
                          - pull:
                                exporter:
                                    prometheus:
                                        host: 0.0.0.0
                                        port: 8888
              pipelines:
                  traces:
                      receivers: [otlp]
                      processors: [memory_limiter, k8s_attributes, resource, filter/noise, batch]
                      exporters: [otlp_grpc]
                  metrics:
                      receivers: [otlp]
                      processors: [memory_limiter, k8s_attributes, resource, batch]
                      exporters: [otlp_grpc]
                  logs:
                      receivers: [otlp]
                      processors: [memory_limiter, k8s_attributes, resource, batch]
                      exporters: [otlp_grpc]
- apiVersion: v1
  kind: ServiceAccount
  metadata:
      name: otel-agent
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRole
  metadata:
      name: otel-agent
  rules:
      - apiGroups: [""]
        resources: [pods, namespaces, nodes]
        verbs: [get, list, watch]
      - apiGroups: [apps]
        resources: [replicasets, deployments, statefulsets, daemonsets]
        verbs: [get, list, watch]
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRoleBinding
  metadata:
      name: otel-agent
  subjects:
      - kind: ServiceAccount
        name: otel-agent
        namespace: opentelemetry
  roleRef:
      kind: ClusterRole
      name: otel-agent
      apiGroup: rbac.authorization.k8s.io
