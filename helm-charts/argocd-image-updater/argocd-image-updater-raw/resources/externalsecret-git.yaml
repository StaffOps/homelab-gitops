# SSH deploy key (read-write, only StaffOps/homelab-gitops-apps) the Image Updater pushes with: Vault
# homelab/argocd-image-updater sshPrivateKey. GitHub's host key comes from argocd-ssh-known-hosts-cm.
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: image-updater-git
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: image-updater-git
      data:
          - secretKey: sshPrivateKey
            remoteRef:
                key: {{ .Values.vault.prefix }}/argocd-image-updater
                property: sshPrivateKey
