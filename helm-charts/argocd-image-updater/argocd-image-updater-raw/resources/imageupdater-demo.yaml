# Trial: keep podinfo of the sandbox app on the newest 6.x (semver). The new tag is written into the app's
# values.yaml and pushed to main of homelab-gitops-apps; Argo CD then syncs it like any commit.
- apiVersion: argocd-image-updater.argoproj.io/v1alpha1
  kind: ImageUpdater
  metadata:
      name: image-updater-demo
  spec:
      writeBackConfig:
          method: git:secret:argo/image-updater-git
          gitConfig:
              repository: git@github.com:StaffOps/homelab-gitops-apps.git
              branch: main
              writeBackTarget: helmvalues:values.yaml
      applicationRefs:
          - namePattern: image-updater-demo
            images:
                - alias: podinfo
                  imageName: ghcr.io/stefanprodan/podinfo:6.x
                  commonUpdateSettings:
                      updateStrategy: semver
                  manifestTargets:
                      helm:
                          name: image.repository
                          tag: image.tag
