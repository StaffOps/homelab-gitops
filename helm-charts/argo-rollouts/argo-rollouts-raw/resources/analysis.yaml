# Cluster-wide analysis templates for canary steps, querying the lab Prometheus. Use them from a Rollout with
# templates: [{templateName: <name>, clusterScope: true}] and pass the args.
#
# success-rate: share of non-5xx responses of a Service, measured at the shared Gateway (the only Istio reporter:
# workloads are not in the ambient mesh, so istio_requests_total exists only with reporter="source" from the
# Gateway pods). Same formula as the Istio "Global Request Success Rate" panel. With less than min-rps the result is
# empty and counts as success (no traffic, nothing to judge).
- apiVersion: argoproj.io/v1alpha1
  kind: ClusterAnalysisTemplate
  metadata:
      name: success-rate
  spec:
      args:
          - name: service-name
          - name: namespace
          - name: min-success-rate
            value: "0.95"
          - name: min-rps
            value: "0.1"
      metrics:
          - name: success-rate
            initialDelay: 1m
            interval: 1m
            count: 5
            failureLimit: 1
            successCondition: len(result) == 0 || result[0] >= {{`{{args.min-success-rate}}`}}
            provider:
                prometheus:
                    address: http://kps-prometheus.monitoring.svc:9090
                    query: |
                        (
                            sum(rate(istio_requests_total{reporter="source", destination_service_name="{{`{{args.service-name}}`}}", destination_service_namespace="{{`{{args.namespace}}`}}", response_code!~"5.."}[2m]))
                            /
                            sum(rate(istio_requests_total{reporter="source", destination_service_name="{{`{{args.service-name}}`}}", destination_service_namespace="{{`{{args.namespace}}`}}"}[2m]))
                        )
                        and
                        sum(rate(istio_requests_total{reporter="source", destination_service_name="{{`{{args.service-name}}`}}", destination_service_namespace="{{`{{args.namespace}}`}}"}[2m])) > {{`{{args.min-rps}}`}}
# p95-latency: 95th percentile request duration of a Service at the Gateway, in milliseconds (istio_request_duration
# _milliseconds histogram, standard histogram_quantile).
- apiVersion: argoproj.io/v1alpha1
  kind: ClusterAnalysisTemplate
  metadata:
      name: p95-latency
  spec:
      args:
          - name: service-name
          - name: namespace
          - name: max-latency-ms
            value: "500"
      metrics:
          - name: p95-latency
            initialDelay: 1m
            interval: 1m
            count: 5
            failureLimit: 1
            successCondition: len(result) == 0 || isNaN(result[0]) || result[0] <= {{`{{args.max-latency-ms}}`}}
            provider:
                prometheus:
                    address: http://kps-prometheus.monitoring.svc:9090
                    query: |
                        histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket{reporter="source", destination_service_name="{{`{{args.service-name}}`}}", destination_service_namespace="{{`{{args.namespace}}`}}"}[2m])))
# pod-restarts: container restarts of the canary's pods during the step (kube-state-metrics). Any restart fails it.
- apiVersion: argoproj.io/v1alpha1
  kind: ClusterAnalysisTemplate
  metadata:
      name: pod-restarts
  spec:
      args:
          - name: namespace
          - name: pod-prefix
          - name: max-restarts
            value: "0"
      metrics:
          - name: pod-restarts
            initialDelay: 1m
            interval: 1m
            count: 3
            failureLimit: 1
            successCondition: len(result) == 0 || result[0] <= {{`{{args.max-restarts}}`}}
            provider:
                prometheus:
                    address: http://kps-prometheus.monitoring.svc:9090
                    query: |
                        sum(increase(kube_pod_container_status_restarts_total{namespace="{{`{{args.namespace}}`}}", pod=~"{{`{{args.pod-prefix}}`}}.*"}[2m]))
