# Vault homelab/harbor: admin-password (initial password of the local "admin", break-glass), secret-key (exactly
# 16 characters: encrypts the credentials Harbor stores, e.g. replication endpoints; keep it), oidc-client-secret
# (client "harbor" of the Keycloak realm, same value the realm import reads).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: harbor-vault
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: harbor-vault
      data:
          - secretKey: HARBOR_ADMIN_PASSWORD
            remoteRef:
                key: {{ .Values.vault.prefix }}/harbor
                property: admin-password
          - secretKey: secretKey
            remoteRef:
                key: {{ .Values.vault.prefix }}/harbor
                property: secret-key
# Login with Keycloak, applied by harbor-core at every start (Harbor "CONFIG_OVERWRITE_JSON"). Members of
# /harbor/admin are Harbor system admins; other users are onboarded on first login and get project access through
# their groups (add the OIDC group to a project as a member).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: harbor-oidc
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: harbor-oidc
          template:
              engineVersion: v2
              data:
                  CONFIG_OVERWRITE_JSON: |
                      {
                          "auth_mode": "oidc_auth",
                          "oidc_name": "Keycloak",
                          "oidc_endpoint": "https://keycloak.{{ .Values.domain }}/realms/{{ .Values.keycloak.realm }}",
                          "oidc_client_id": "harbor",
                          "oidc_client_secret": "{{`{{ .clientSecret }}`}}",
                          "oidc_scope": "openid,profile,email,groups,offline_access",
                          "oidc_groups_claim": "groups",
                          "oidc_admin_group": "/harbor/admin",
                          "oidc_user_claim": "preferred_username",
                          "oidc_verify_cert": true,
                          "oidc_auto_onboard": true
                      }
      data:
          - secretKey: clientSecret
            remoteRef:
                key: {{ .Values.vault.prefix }}/harbor
                property: oidc-client-secret
# Shared secrets between Harbor components (core, jobservice, registry): random, generated once by External
# Secrets (refreshPolicy CreatedOnce) and never rotated. Losing them is harmless: delete the Secret and restart
# Harbor to get new ones.
- apiVersion: generators.external-secrets.io/v1alpha1
  kind: Password
  metadata:
      name: harbor-16
  spec:
      length: 16
      symbols: 0
      allowRepeat: true
- apiVersion: generators.external-secrets.io/v1alpha1
  kind: Password
  metadata:
      name: harbor-32
  spec:
      length: 32
      symbols: 0
      allowRepeat: true
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: harbor-internal
  spec:
      refreshPolicy: CreatedOnce
      target:
          name: harbor-internal
          template:
              engineVersion: v2
              data:
                  secret: '{{`{{ .core }}`}}'
                  CSRF_KEY: '{{`{{ .xsrf }}`}}'
                  JOBSERVICE_SECRET: '{{`{{ .jobservice }}`}}'
                  REGISTRY_HTTP_SECRET: '{{`{{ .registryhttp }}`}}'
                  REGISTRY_PASSWD: '{{`{{ .registry }}`}}'
                  REGISTRY_HTPASSWD: '{{`{{ htpasswd "harbor_registry_user" .registry }}`}}'
      dataFrom:
          {{- range $k, $g := dict "core" "harbor-16" "jobservice" "harbor-16" "registryhttp" "harbor-16" "xsrf" "harbor-32" "registry" "harbor-32" }}
          - sourceRef:
                generatorRef:
                    apiVersion: generators.external-secrets.io/v1alpha1
                    kind: Password
                    name: {{ $g }}
            rewrite:
                - regexp:
                      source: ^password$
                      target: {{ $k }}
          {{- end }}
