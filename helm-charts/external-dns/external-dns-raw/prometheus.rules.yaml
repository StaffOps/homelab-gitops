# Inserted as-is (readFile, no tpl): write Prometheus templates plainly.
# external-dns v0.23.0 metrics and alerting recommendations:
# https://kubernetes-sigs.github.io/external-dns/v0.23.0/docs/monitoring/ ("last_sync_timestamp_seconds not updating
# indicates the sync loop may be stuck"). Thresholds are derived (docs/dashboards/networking.md): interval is 1m.
groups:
    - name: external-dns
      rules:
          - alert: ExternalDNSSyncStale
            expr: time() - external_dns_controller_last_sync_timestamp_seconds > 600
            labels:
                severity: warning
            annotations:
                summary: external-dns has not synced with Cloudflare for more than 10 minutes — check its logs (Cloudflare token, API errors)
                description: "Last successful sync {{ $value | humanizeDuration }} ago on {{ $labels.pod }}. New HTTPRoute hostnames are not published."
          - alert: ExternalDNSConsecutiveSoftErrors
            expr: external_dns_controller_consecutive_soft_errors > 3
            labels:
                severity: warning
            annotations:
                summary: external-dns failed {{ $value }} reconciliation loops in a row — check its logs and external_dns_source/registry_errors_total
