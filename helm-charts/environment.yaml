# Values shared by every helmfile under helm-charts/ (loaded as `../environment.yaml`, or
# `../../environment.yaml` from helm-charts/argo). Change the lab here, not in each app.
cluster:
    name: k8s01 # kube context and node name; bootstrap.sh refuses any other context
domain: staffops.space # public zone on Cloudflare; every HTTPRoute uses <app>.<domain>
acmeEmail: contact@staffops.space
storageClass: local-path # default StorageClass from helm-charts/local-path-provisioner (single node)
zone: k8s-local # topology.kubernetes.io/zone stamped on every Pod by Kyverno (helm-charts/kyverno/kyverno-raw)
gitops:
    repoURL: https://github.com/StaffOps/homelab-gitops.git
    revision: main
# Workload apps: separate repo, one helmfile directory per app with an app.yaml (ApplicationSet apps, AppProject apps)
apps:
    repoURL: https://github.com/StaffOps/homelab-gitops-apps.git
    revision: main
# Remote clusters managed by this Argo CD (ADR 0008). The VPS runs k3s and is reached over the Tailscale tailnet:
# the API answers only on tailscale0. IP, not the MagicDNS name: CoreDNS forwards to the node's resolver, which
# does not resolve *.ts.net. The IP is in the k3s certificate SANs. Credentials: Vault homelab/argocd-cluster-vps.
# Two halves: the base (CRDs, operators, collectors) is helm-charts/<app> rendered with --environment vps
# (values in environment-vps.yaml; ApplicationSet platform-vps, AppProject platform-vps); the apps live in
# homelab-gitops-apps under vps/<app>/<release> (ApplicationSet vps, AppProject vps), which may not touch the
# base namespaces (platform.namespaces in environment-vps.yaml, read by helm-charts/argo).
remoteClusters:
    vps:
        server: https://100.81.185.50:6443
# Namespaces of the platform (system ones + every element of ApplicationSet platform). Used by AppProject apps (workload
# apps may not deploy there) and by ClusterSecretStore vault (only these namespaces may read secret/homelab/*).
# Add a namespace here when a platform app is added.
platform:
    namespaces:
        - default
        - kube-system
        - kube-public
        - kube-node-lease
        - argo
        - calico-system
        - calico-apiserver
        - tigera-operator
        - local-path-storage
        - metallb-system
        - vault
        - external-secrets
        - cert-manager
        - external-dns
        - istio-system
        - gateway
        - monitoring
        - opentelemetry
        - cnpg-system
        - keycloak
        - keda
        - dependency-track
        - velero
        - kyverno
        - nvidia-device-plugin
        - mcp-servers
        - llm
        - harbor
        - argo-rollouts
        - argo-events
        - argo-workflows
        - defectdojo
# MetalLB L2 pool on the home LAN (outside the router's DHCP range)
metallb:
    addresses:
        - 192.168.68.240-192.168.68.245
# Shared Gateway (Istio, Gateway API). Every app attaches an HTTPRoute to it.
gateway:
    name: public
    namespace: gateway
    address: 192.168.68.240
    # Second Gateway only for mcp.<domain>: it validates Keycloak JWTs on every request. Kept apart because
    # Istio validates ANY "Authorization: Bearer" on its Gateway, which would break other hosts' tokens
    # (Keycloak admin console = master-realm JWT, llm API key, Argo CD / Grafana tokens).
    mcp:
        name: mcp
        address: 192.168.68.241
# external-dns of this cluster (helm-charts/external-dns). k8s01 publishes HTTPRoutes and owns its records
# (sync deletes only records with its owner TXT). The VPS uses its own values (environment-vps.yaml).
externalDns:
    sources:
        - gateway-httproute
    policy: sync
    txtOwnerId: k8s01
    txtPrefix: _extdns.
# Vault (in-cluster) is the only secret source; External Secrets reads it with Kubernetes auth.
vault:
    address: http://vault.vault.svc:8200
    kvMount: secret # KV v2
    prefix: homelab # secrets live at secret/homelab/<name>
    authMount: kubernetes # Kubernetes auth mount of this cluster (the VPS uses kubernetes-vps)
# Velero backups to Cloudflare R2 (S3-compatible). The bucket is created by hand in the Cloudflare dashboard.
# Credentials AND the S3 endpoint (it contains the Cloudflare account id) live in Vault homelab/velero, never here;
# the endpoint reaches the BackupStorageLocation through the Argo CD render env (argocd-render-env).
backup:
    bucket: staffops-k8s-local-velero
    ttl: 720h # 30 days
    namespaces: # namespaces whose objects and volumes are backed up daily
        - vault
        - keycloak
        - dependency-track
    # PostgreSQL (CloudNativePG clusters): Barman Cloud plugin, daily base backup + continuous WAL archiving
    # (point-in-time recovery) to s3://<bucket>/<prefix>/<cluster>/, same bucket and R2 token as Velero (Vault
    # homelab/velero). Velero skips the pgdata volumes: a file copy of a running database is not consistent.
    postgres:
        prefix: cnpg
        retention: 30d
        schedule: "0 0 2 * * *" # 6-field cron (seconds first), UTC; an hour before Velero
        # Disaster recovery (docs/runbooks/disaster-recovery.md): uncomment BEFORE bootstrapping a rebuilt node, so every
        # CloudNativePG Cluster is recovered from its R2 backups instead of starting empty (initdb).
        # restore: true
        # restoreTargetTime: "2026-11-15 10:00:00+00" # optional point in time; default: the latest WAL
        # restoreFromSuffix: "" # suffix the backups were taken under ("" = original names, "-r1" after one recovery)
        # serverSuffix: "-r1" # new WAL archive path from now on; never reuse one; keep it set after the recovery
# Keycloak realm that holds the lab's users and OIDC clients (Argo CD, Grafana, Vault)
keycloak:
    realm: staffops
    # Tools that log in through Keycloak. Each gets groups /<tool>/admin and /<tool>/viewer in the realm
    # (claim "groups" carries the full path); the tool maps them to its admin and read-only roles.
    apps:
        - argocd
        - grafana
        - vault
        - dependency-track
        - mcp # MCP servers at https://mcp.<domain>/<name> (Gateway JWT check)
        - harbor
        - argo-workflows
