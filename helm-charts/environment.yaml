# Values shared by every helmfile under helm-charts/ (loaded as `../environment.yaml`, or
# `../../environment.yaml` from helm-charts/argo). Change the lab here, not in each app.
cluster:
    name: k8s01 # kube context and node name; bootstrap.sh refuses any other context
domain: staffops.space # public zone on Cloudflare; every HTTPRoute uses <app>.<domain>
acmeEmail: contact@staffops.space
storageClass: local-path # default StorageClass from helm-charts/local-path-provisioner (single node)
zone: k8s-local # topology.kubernetes.io/zone stamped on every Pod by Kyverno (helm-charts/kyverno/kyverno-raw)
gitops:
    repoURL: https://github.com/karlipegomes/homelab-gitops.git
    revision: main
# MetalLB L2 pool on the home LAN (outside the router's DHCP range)
metallb:
    addresses:
        - 192.168.68.240-192.168.68.245
# Shared Gateway (Istio, Gateway API). Every app attaches an HTTPRoute to it.
gateway:
    name: public
    namespace: gateway
    address: 192.168.68.240
# Vault (in-cluster) is the only secret source; External Secrets reads it with Kubernetes auth.
vault:
    address: http://vault.vault.svc:8200
    kvMount: secret # KV v2
    prefix: homelab # secrets live at secret/homelab/<name>
# Velero backups to Cloudflare R2 (S3-compatible). The bucket is created by hand in the Cloudflare dashboard.
# Credentials AND the S3 endpoint (it contains the Cloudflare account id) live in Vault homelab/velero, never here;
# the endpoint reaches the BackupStorageLocation through the Argo CD render env (argocd-render-env).
backup:
    bucket: staffops-k8s-local-velero
    ttl: 720h # 30 days
    namespaces: # namespaces whose objects and volumes are backed up daily
        - vault
        - keycloak
        - dependency-track
# Keycloak realm that holds the lab's users and OIDC clients (Argo CD, Grafana, Vault)
keycloak:
    realm: staffops
    # Tools that log in through Keycloak. Each gets groups /<tool>/admin and /<tool>/viewer in the realm
    # (claim "groups" carries the full path); the tool maps them to its admin and read-only roles.
    apps:
        - argocd
        - grafana
        - vault
        - dependency-track
        - mcp # MCP servers at https://mcp.<domain>/<name> (Gateway JWT check)
