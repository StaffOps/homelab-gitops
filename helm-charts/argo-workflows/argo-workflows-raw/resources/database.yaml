# PostgreSQL for the workflow archive (CloudNativePG). The operator generates Secret workflows-db-app (username, password).
- apiVersion: postgresql.cnpg.io/v1
  kind: Cluster
  metadata:
      name: workflows-db
  spec:
      instances: 1
      storage:
          storageClass: {{ .Values.storageClass }}
          size: 5Gi
      bootstrap:
          initdb:
              database: argo
              owner: argo
      # metrics: one PodMonitor for every cluster (cloudnative-pg-raw); the per-cluster one is deprecated
      monitoring:
          enablePodMonitor: false
      # Base backups + WAL to R2 through the Barman Cloud plugin (ObjectStore workflows-db-r2 below)
      plugins:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
                barmanObjectName: workflows-db-r2
      resources:
          requests:
              cpu: 50m
              memory: 256Mi
          limits:
              memory: 1Gi
# Object store for workflows-db (Barman Cloud plugin): s3://<bucket>/<prefix>/workflows-db/. Credentials: the Velero R2
# token (Vault homelab/velero); endpoint: R2_ENDPOINT from the Argo CD render env, never in git.
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: workflows-db-r2
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: workflows-db-r2
      data:
          - secretKey: ACCESS_KEY_ID
            remoteRef:
                key: {{ .Values.vault.prefix }}/velero
                property: access-key-id
          - secretKey: ACCESS_SECRET_KEY
            remoteRef:
                key: {{ .Values.vault.prefix }}/velero
                property: secret-access-key
- apiVersion: barmancloud.cnpg.io/v1
  kind: ObjectStore
  metadata:
      name: workflows-db-r2
  spec:
      retentionPolicy: {{ .Values.backup.postgres.retention | quote }}
      configuration:
          destinationPath: s3://{{ .Values.backup.bucket }}/{{ .Values.backup.postgres.prefix }}/
          {{- with env "R2_ENDPOINT" }}
          endpointURL: {{ . }}
          {{- end }}
          s3Credentials:
              accessKeyId:
                  name: workflows-db-r2
                  key: ACCESS_KEY_ID
              secretAccessKey:
                  name: workflows-db-r2
                  key: ACCESS_SECRET_KEY
          wal:
              compression: gzip
          data:
              compression: gzip
      instanceSidecarConfiguration:
          # R2 rejects the boto3 default checksum headers (plugin docs, "Object Store Providers")
          env:
              - name: AWS_REQUEST_CHECKSUM_CALCULATION
                value: when_required
              - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                value: when_required
          resources:
              requests:
                  cpu: 10m
                  memory: 64Mi
              limits:
                  memory: 256Mi
- apiVersion: postgresql.cnpg.io/v1
  kind: ScheduledBackup
  metadata:
      name: workflows-db-daily
  spec:
      schedule: {{ .Values.backup.postgres.schedule | quote }}
      backupOwnerReference: self
      immediate: true
      cluster:
          name: workflows-db
      method: plugin
      pluginConfiguration:
          name: barman-cloud.cloudnative-pg.io
