# SSO client (Keycloak realm client "argo-workflows"; secret in Vault homelab/argo-workflows: oidc-client-secret,
# the same value the realm import reads)
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: argo-workflows-sso
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: argo-workflows-sso
          template:
              engineVersion: v2
              data:
                  client-id: argo-workflows
                  client-secret: '{{`{{ .clientSecret }}`}}'
      data:
          - secretKey: clientSecret
            remoteRef:
                key: {{ .Values.vault.prefix }}/argo-workflows
                property: oidc-client-secret
# Logs and artifacts in R2: a token scoped to the workflowArtifacts bucket only (Vault homelab/argo-workflows-r2), never
# the Velero one: argo-server reads this Secret with the caller's token, and Backstage's reader may get it
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: argo-workflows-r2
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: argo-workflows-r2
      data:
          - secretKey: accessKey
            remoteRef:
                key: {{ .Values.vault.prefix }}/argo-workflows-r2
                property: access-key-id
          - secretKey: secretKey
            remoteRef:
                key: {{ .Values.vault.prefix }}/argo-workflows-r2
                property: secret-access-key
# Argo CD API token of the local account "argo-workflows" (get + sync applications only), used by the
# ClusterWorkflowTemplate argocd-sync. Vault homelab/argo-workflows: argocd-token (docs/runbooks/argo-workflows.md).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: argocd-token
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: ClusterSecretStore
          name: vault
      target:
          name: argocd-token
      data:
          - secretKey: token
            remoteRef:
                key: {{ .Values.vault.prefix }}/argo-workflows
                property: argocd-token
