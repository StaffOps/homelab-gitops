# ServiceAccount the workflow pods run as (controller.workflowDefaults). Rights: report step results (executor),
# keep state in ConfigMaps (github-watch) and submit workflows (a step that starts another workflow).
- apiVersion: v1
  kind: ServiceAccount
  metadata:
      name: argo-workflow
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
      name: argo-workflow
  rules:
      - apiGroups: [argoproj.io]
        resources: [workflowtaskresults]
        verbs: [create, patch]
      - apiGroups: [argoproj.io]
        resources: [workflows]
        verbs: [create, get, list, watch]
      - apiGroups: [argoproj.io]
        resources: [workflowtemplates, clusterworkflowtemplates]
        verbs: [get, list]
      - apiGroups: [""]
        resources: [configmaps]
        verbs: [get, create, update, patch]
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
      name: argo-workflow
  roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: argo-workflow
  subjects:
      - kind: ServiceAccount
        name: argo-workflow
# clusterworkflowtemplates are cluster-scoped: reading them needs a ClusterRole
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRoleBinding
  metadata:
      name: argo-workflow-read-templates
  roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: argo-workflows-view
  subjects:
      - kind: ServiceAccount
        name: argo-workflow
        namespace: argo-workflows
# Argo Events Sensors (ServiceAccount argo-events-sensor in argo-events) submit workflows here
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
      name: argo-events-sensor
  roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: argo-workflows-edit
  subjects:
      - kind: ServiceAccount
        name: argo-events-sensor
        namespace: argo-events
# SSO RBAC (server.sso.rbac): a Keycloak user acts as the first ServiceAccount whose rule matches their groups.
# /argo-workflows/admin → argo-workflows-admin, /argo-workflows/viewer → argo-workflows-view, others → no access.
# Each needs a long-lived token Secret (the server reads it).
{{- range $sa := list (dict "name" "sso-admin" "group" "/argo-workflows/admin" "role" "argo-workflows-admin" "precedence" "2") (dict "name" "sso-viewer" "group" "/argo-workflows/viewer" "role" "argo-workflows-view" "precedence" "1") }}
- apiVersion: v1
  kind: ServiceAccount
  metadata:
      name: {{ $sa.name }}
      annotations:
          workflows.argoproj.io/rbac-rule: '"{{ $sa.group }}" in groups'
          workflows.argoproj.io/rbac-rule-precedence: "{{ $sa.precedence }}"
- apiVersion: v1
  kind: Secret
  type: kubernetes.io/service-account-token
  metadata:
      name: {{ $sa.name }}.service-account-token
      annotations:
          kubernetes.io/service-account.name: {{ $sa.name }}
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRoleBinding
  metadata:
      name: argo-workflows-{{ $sa.name }}
  roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: {{ $sa.role }}
  subjects:
      - kind: ServiceAccount
        name: {{ $sa.name }}
        namespace: argo-workflows
{{- end }}
