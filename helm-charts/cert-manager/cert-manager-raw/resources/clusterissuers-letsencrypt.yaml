# Let's Encrypt issuers (DNS-01 on Cloudflare). Test new hostnames with letsencrypt-staging first:
# production has strict rate limits.
{{- range $name, $server := dict "letsencrypt-prod" "https://acme-v02.api.letsencrypt.org/directory" "letsencrypt-staging" "https://acme-staging-v02.api.letsencrypt.org/directory" }}
- apiVersion: cert-manager.io/v1
  kind: ClusterIssuer
  metadata:
      name: {{ $name }}
  spec:
      acme:
          email: {{ $.Values.acmeEmail }}
          server: {{ $server }}
          privateKeySecretRef:
              name: {{ $name }}
          solvers:
              - dns01:
                    cloudflare:
                        apiTokenSecretRef:
                            name: cloudflare-api-token
                            key: api-token
                selector:
                    dnsZones:
                        - {{ $.Values.domain }}
{{- end }}
