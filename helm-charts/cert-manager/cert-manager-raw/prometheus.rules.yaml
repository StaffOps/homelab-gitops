# Inserted as-is (readFile, no tpl): write Prometheus templates plainly.
# Mixin = cert-manager-mixin (https://github.com/imusmanmalik/cert-manager-mixin, rendered alerts:
# https://github.com/monitoring-mixins/website/blob/master/assets/cert-manager/alerts.yaml).
# The scrape sets namespace=cert-manager; the Certificate's own namespace is exported_namespace.
groups:
    - name: cert-manager
      rules:
          # Lab threshold (False for 30m); matcher and aggregation from the mixin's CertManagerCertNotReady
          # (condition!="True"), so a stuck Unknown condition is caught too.
          - alert: CertificateNotReady
            expr: |-
                max by (name, exported_namespace, namespace, condition) (certmanager_certificate_ready_status{condition!="True"} == 1)
            for: 30m
            labels:
                severity: warning
            annotations:
                summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready (condition {{ $labels.condition }})
                description: Check `kubectl --context k8s01 -n {{ $labels.exported_namespace }} describe certificate {{ $labels.name }}` and its CertificateRequest/Order.
                runbook_url: https://github.com/imusmanmalik/cert-manager-mixin/blob/main/RUNBOOK.md#certmanagercertnotready
          - alert: CertificateExpiringSoon
            expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 24 * 3600
            for: 1h
            labels:
                severity: warning
            annotations:
                summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 14 days
          # Mixin, as is; static namespace label added (absent() keeps only job).
          - alert: CertManagerAbsent
            expr: absent(up{job="cert-manager"})
            for: 10m
            labels:
                severity: critical
                namespace: cert-manager
            annotations:
                summary: cert-manager has disappeared from Prometheus service discovery — check the cert-manager Deployment and its ServiceMonitor
                description: New certificates will not be able to be minted, and existing ones can't be renewed until cert-manager is back.
                runbook_url: https://github.com/imusmanmalik/cert-manager-mixin/blob/main/RUNBOOK.md#certmanagerabsent
          # Mixin, same threshold; "sum by (host)" became "sum by (namespace, host)" to keep namespace=cert-manager.
          - alert: CertManagerHittingRateLimits
            expr: |-
                sum by (namespace, host) (rate(certmanager_http_acme_client_request_count{status="429"}[5m])) > 0
            for: 5m
            labels:
                severity: critical
            annotations:
                summary: cert-manager is hitting rate limits of {{ $labels.host }} — stop retries and check Orders/Challenges
                description: Depending on the rate limit, cert-manager may be unable to generate certificates for up to a week.
                runbook_url: https://github.com/imusmanmalik/cert-manager-mixin/blob/main/RUNBOOK.md#certmanagerhittingratelimits
